name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # The unit tests never touch the network. This does: a real install from
  # Microsoft's metadata, through the shim, on every platform — the part a
  # mocked test cannot vouch for.
  smoke:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Install, pin and run through the shim
        shell: bash
        run: |
          export DV_HOME="$RUNNER_TEMP/dv home"
          dv="$PWD/target/release/dv"
          "$dv" install lts
          export PATH="$DV_HOME/shims:$PATH"
          # bash on Windows will not run the .cmd shim by bare name, so the
          # shim itself is exercised where a shell would use it.
          if [ "$RUNNER_OS" = Windows ]; then
            dotnet() { "$dv" run dotnet "$@"; }
          else
            [ "$(command -v dotnet)" = "$DV_HOME/shims/dotnet" ]
          fi
          mkdir -p "$RUNNER_TEMP/project" && cd "$RUNNER_TEMP/project"
          "$dv" pin lts
          "$dv" resolve --format json
          dotnet --version
          dotnet new console -o app
          dotnet run --project app
          "$dv" doctor || true
