name: docs

# Build the documentation site and publish it to GitHub Pages.
#
# The platform matrix is generated from release.yml at build time, so a change
# to the release builds updates the site on the next push — a page claiming a
# build that is never published is worse than none.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/release.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a queued run supersedes a waiting one rather than
# racing it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      # Fails loudly if release.yml changed shape, rather than silently
      # publishing a stale platform table.
      - run: npm run generate
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
